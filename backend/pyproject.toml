[project]
name = "nba-props"
version = "0.1.0"
description = "NBA player prop projection model + API"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "lightgbm>=4.0",
  "joblib>=1.3",
  "pyarrow>=14",
  "nba_api>=1.4",
  "httpx>=0.25",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["nba_props*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pandas.errors.PerformanceWarning"]

[tool.ruff]
line-length = 110
